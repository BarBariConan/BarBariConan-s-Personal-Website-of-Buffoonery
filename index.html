<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Aero UI</title>
    <style>
        /* 1. Setup default Windows-like desktop background */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #005a9e, #0078d4, #00b7c3);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            perspective: 1000px; /* Crucial for 3D depth perception */
        }

        /* 2. The Core Aero Window Styling */
        .aero-window {
            width: 400px;
            height: 250px;
            border-radius: 8px;
            position: relative;
            
            /* Glassmorphism/Aero Blend */
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px) saturate(160%);
            -webkit-backdrop-filter: blur(12px) saturate(160%);
            
            /* Windows Vista/7 reflections and borders */
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);

            /* 3D Animation Trigger */
            transform-style: preserve-3d;
            animation: rotateWindow 8s linear infinite;
        }

        /* Window Title Bar */
        .title-bar {
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            border-top-left-radius: 7px;
            border-top-right-radius: 7px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            font-size: 13px;
            font-weight: 600;
        }

        /* Window Content Area */
        .content {
            padding: 20px;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }

        /* 3. Infinite 3D Rotation Keyframes */
        @keyframes rotateWindow {
            0% {
                transform: rotateY(0deg) rotateX(10deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(10deg);
            }
        }
    </style>
</head>
<body>

    <!-- Aero Window Structure -->
    <div class="aero-window">
        <div class="title-bar">Spinny Window.exe</div>
        <div class="content">
            <h3>Welcome Traveller</h3>
            <p>This website is my personal little hub for tidbits and experiments like this (yes, i like frutiger aero)</p>
        </div>
    </div>

</body>
